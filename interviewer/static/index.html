<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Interviewer — Nova Sonic 2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 2rem 1rem;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.3rem; color: #8b9cf7; }
    .subtitle { font-size: 0.85rem; color: #666; margin-bottom: 1.5rem; }

    /* Setup */
    #setup { width: 90%; max-width: 700px; display: flex; flex-direction: column; gap: 1rem; }
    .section-label { font-size: 0.85rem; color: #aaa; margin-bottom: 0.2rem; }

    /* Job cards */
    #job-cards {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
    }
    .job-card {
      background: #1a1a2e; border: 1px solid #333; border-radius: 20px;
      padding: 0.4rem 0.9rem; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.8rem; white-space: nowrap;
    }
    .job-card:hover { border-color: #8b9cf7; }
    .job-card.selected { border-color: #8b9cf7; background: #1f1f3a; }
    .job-card .card-title { font-weight: 600; color: #e0e0e0; }
    .job-card .card-company { display: none; }
    .job-card .card-location { display: none; }

    .divider {
      display: flex; align-items: center; gap: 0.8rem;
      font-size: 0.8rem; color: #555; margin: 0.3rem 0;
    }
    .divider::before, .divider::after {
      content: ""; flex: 1; height: 1px; background: #333;
    }

    /* Job description preview / custom */
    #job-desc {
      width: 100%; min-height: 120px;
      background: #1a1a2e; color: #e0e0e0;
      border: 1px solid #333; border-radius: 10px;
      padding: 0.8rem; font-size: 0.82rem;
      resize: vertical; font-family: inherit;
    }
    #job-desc:focus { outline: none; border-color: #8b9cf7; }
    #job-desc::placeholder { color: #555; }

    .custom-actions {
      display: flex; align-items: center; gap: 0.8rem;
    }
    #generate-btn {
      padding: 0.5rem 1rem;
      background: transparent; color: #8b9cf7;
      border: 1px solid #8b9cf7; border-radius: 6px;
      font-size: 0.82rem; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
    }
    #generate-btn:hover { background: #1f1f3a; }
    #generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #generate-status { font-size: 0.8rem; color: #ffc107; }

    #start-btn {
      align-self: center; padding: 0.7rem 2.5rem;
      background: #8b9cf7; color: #0f0f1a;
      border: none; border-radius: 8px;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    #start-btn:hover { background: #a0b0ff; }
    #start-btn:disabled { background: #444; color: #888; cursor: not-allowed; }

    /* Interview */
    #interview { display: none; flex-direction: column; align-items: center; }
    #current-job-tag {
      font-size: 0.8rem; color: #8b9cf7; background: #1f1f3a;
      padding: 0.3rem 0.8rem; border-radius: 20px; margin-bottom: 0.8rem;
    }
    #status { font-size: 0.85rem; color: #888; margin-bottom: 1rem; min-height: 1.2em; }
    #mic-btn {
      width: 110px; height: 110px; border-radius: 50%; border: 3px solid #333;
      background: #1a1a2e; color: #8b9cf7; font-size: 2.5rem; cursor: pointer;
      transition: all 0.3s; display: flex; align-items: center; justify-content: center;
    }
    #mic-btn:hover { border-color: #8b9cf7; }
    #mic-btn.active { border-color: #f44; background: #2a1a1a; animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(244,68,68,0.4); }
      50% { box-shadow: 0 0 0 20px rgba(244,68,68,0); }
    }
    #stop-interview {
      margin-top: 1rem; padding: 0.5rem 1.5rem;
      background: transparent; color: #888;
      border: 1px solid #444; border-radius: 6px;
      font-size: 0.8rem; cursor: pointer;
    }
    #stop-interview:hover { border-color: #f44; color: #f44; }

    /* Avatar */
    #avatar-container {
      width: 200px; height: 200px;
      border-radius: 50%; overflow: hidden;
      border: 3px solid #333; margin-bottom: 0.8rem;
      background: #1a1a2e; position: relative;
      transition: border-color 0.3s;
    }
    #avatar-container.talking { border-color: #a5d6a7; }
    #avatar-container.listening { border-color: #6ec6ff; }
    #avatar-canvas { width: 100%; height: 100%; }

    /* Transcript */
    #transcript {
      margin-top: 1.5rem; width: 90%; max-width: 700px;
      max-height: 320px; overflow-y: auto;
      padding: 1rem; background: #1a1a2e;
      border-radius: 12px; font-size: 0.85rem; line-height: 1.6;
    }
    .msg-user { color: #6ec6ff; }
    .msg-assistant { color: #a5d6a7; }
    .msg-error { color: #f44; }
    .msg-system { color: #888; font-style: italic; }

    /* Report */
    #report-panel {
      margin-top: 1.5rem; width: 90%; max-width: 700px;
      padding: 1.5rem; background: #1a1a2e;
      border-radius: 12px; border: 1px solid #8b9cf7;
      display: none;
    }
    #report-panel h2 { font-size: 1.1rem; color: #8b9cf7; margin-bottom: 1rem; }

    /* Semáforo */
    #score-panel {
      display: flex; align-items: center; gap: 1.2rem;
      padding: 1rem 1.2rem; border-radius: 10px;
      margin-bottom: 1.2rem; background: #12122a;
    }
    .semaforo {
      display: flex; flex-direction: column; gap: 6px;
      padding: 8px; background: #222; border-radius: 8px;
    }
    .semaforo .light {
      width: 28px; height: 28px; border-radius: 50%;
      background: #333; transition: all 0.3s;
    }
    .semaforo .light.red-on { background: #f44336; box-shadow: 0 0 12px #f44336; }
    .semaforo .light.yellow-on { background: #ffc107; box-shadow: 0 0 12px #ffc107; }
    .semaforo .light.green-on { background: #4caf50; box-shadow: 0 0 12px #4caf50; }
    #score-info { display: flex; flex-direction: column; gap: 0.3rem; }
    #score-value { font-size: 2rem; font-weight: 700; }
    #score-label { font-size: 0.85rem; color: #aaa; }
    .score-bar-bg {
      width: 200px; height: 10px; background: #333;
      border-radius: 5px; overflow: hidden; margin-top: 4px;
    }
    .score-bar-fill { height: 100%; border-radius: 5px; transition: width 0.5s; }

    #report-content {
      font-size: 0.85rem; line-height: 1.7;
      white-space: pre-wrap; color: #d0d0d0;
    }
    #report-content strong { color: #a5d6a7; }

    /* Token usage */
    #token-panel {
      margin-top: 1rem; padding: 0.8rem 1rem;
      background: #12122a; border-radius: 8px;
      font-size: 0.8rem; color: #aaa;
      display: none;
    }
    #token-panel .token-title { color: #8b9cf7; font-weight: 600; margin-bottom: 0.5rem; }
    #token-panel table { width: 100%; border-collapse: collapse; }
    #token-panel td { padding: 0.2rem 0.5rem; }
    #token-panel td:last-child { text-align: right; color: #e0e0e0; }
    #token-panel .cost-row td { border-top: 1px solid #333; padding-top: 0.4rem; color: #ffc107; font-weight: 600; }
    #new-interview-btn {
      margin-top: 1.2rem; padding: 0.6rem 1.5rem;
      background: #8b9cf7; color: #0f0f1a;
      border: none; border-radius: 8px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }
    #new-interview-btn:hover { background: #a0b0ff; }

    /* Top bar */
    .top-bar { width: 90%; max-width: 700px; display: flex; justify-content: center; margin-bottom: 1rem; }
    #reports-btn {
      padding: 0.4rem 1rem; background: transparent; color: #8b9cf7;
      border: 1px solid #333; border-radius: 6px; font-size: 0.82rem;
      cursor: pointer; transition: all 0.2s;
    }
    #reports-btn:hover { border-color: #8b9cf7; background: #1f1f3a; }

    /* Reports panel */
    #reports-panel {
      width: 90%; max-width: 700px; background: #1a1a2e;
      border-radius: 12px; border: 1px solid #333;
      margin-bottom: 1.5rem; overflow: hidden;
    }
    .reports-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.8rem 1rem; background: #12122a; font-size: 0.9rem; color: #8b9cf7;
    }
    .reports-header button {
      background: none; border: none; color: #888; font-size: 1rem; cursor: pointer;
    }
    .reports-header button:hover { color: #fff; }
    #reports-list { max-height: 300px; overflow-y: auto; }
    .report-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.7rem 1rem; border-bottom: 1px solid #222;
      cursor: pointer; transition: background 0.2s;
    }
    .report-item:hover { background: #1f1f3a; }
    .report-item:last-child { border-bottom: none; }
    .report-info { display: flex; flex-direction: column; gap: 0.15rem; }
    .report-date { font-size: 0.82rem; color: #e0e0e0; }
    .report-job { font-size: 0.75rem; color: #888; max-width: 500px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .report-open { font-size: 0.75rem; color: #8b9cf7; white-space: nowrap; }
  </style>
</head>
<body>
  <h1>🎙️ AI Interviewer</h1>
  <p class="subtitle">Simulador de entrevista com Amazon Nova Sonic 2</p>

  <div class="top-bar">
    <button id="reports-btn" type="button">📂 Relatórios</button>
  </div>

  <!-- Reports list -->
  <div id="reports-panel" style="display:none;">
    <div class="reports-header">
      <span>📂 Entrevistas Anteriores</span>
      <button id="reports-close" type="button">✕</button>
    </div>
    <div id="reports-list"></div>
  </div>

  <!-- Setup -->
  <div id="setup">
    <div class="section-label">Escolha uma vaga:</div>
    <div id="job-cards"></div>

    <div class="divider">ou crie sua própria vaga</div>

    <textarea id="job-desc" placeholder="Digite o cargo ou uma breve descrição. Ex: 'Desenvolvedor Python Sênior' ou 'Buscamos um gerente de projetos com experiência em metodologias ágeis...'"></textarea>
    <div class="custom-actions">
      <button id="generate-btn" type="button">✨ Gerar descrição completa</button>
      <span id="generate-status"></span>
    </div>
    <button id="start-btn">Iniciar Entrevista</button>
  </div>

  <!-- Interview -->
  <div id="interview">
    <div id="current-job-tag"></div>
    <div id="avatar-container">
      <canvas id="avatar-canvas" width="400" height="400"></canvas>
    </div>
    <div id="status">Conectando...</div>
    <button id="mic-btn" aria-label="Alternar microfone">🎤</button>
    <button id="stop-interview">Encerrar entrevista</button>
  </div>

  <div id="transcript"></div>
  <div id="report-panel">
    <h2>📋 Relatório de Avaliação</h2>
    <div id="score-panel">
      <div class="semaforo">
        <div class="light" id="light-green"></div>
        <div class="light" id="light-yellow"></div>
        <div class="light" id="light-red"></div>
      </div>
      <div id="score-info">
        <div id="score-value">—%</div>
        <div id="score-label">Aderência à vaga</div>
        <div class="score-bar-bg"><div class="score-bar-fill" id="score-bar"></div></div>
      </div>
    </div>
    <div id="report-content"></div>
    <div id="token-panel">
      <div class="token-title">💰 Consumo de Tokens & Custo</div>
      <table id="token-table"></table>
    </div>
    <button id="new-interview-btn">Nova Entrevista</button>
  </div>

  <script src="/entrevistador/static/avatar.js?v=13"></script>
  <script src="/entrevistador/static/app.js?v=13"></script>
</body>
</html>
